name: helpdesk

services:
  postgres:
    image: postgres:16-alpine
    # 4 processos da API e 4 do trabalhador, com pool de até 30 conexões cada, mais mock e canais:
    # o padrão de 100 conexões não basta.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
    ports:
      - "${POSTGRES_PORTA:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d helpdesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSAO:-v24.2.7}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=interno://0.0.0.0:9092,externo://0.0.0.0:19092
      - --advertise-kafka-addr=interno://redpanda:9092,externo://localhost:19092
    ports:
      - "${KAFKA_PORTA:-19092}:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Cria os tópicos uma vez e termina.
  topicos:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSAO:-v24.2.7}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B="-X brokers=redpanda:9092"
        rpk topic create helpdesk.para-agente agente.para-helpdesk -p 12 $$B || true
        rpk topic create helpdesk.erros -p 3 $$B || true
        rpk topic describe helpdesk.para-agente agente.para-helpdesk helpdesk.erros $$B -p > /dev/null
        rpk topic list $$B

  # Aplica as migrations e termina.
  migracoes:
    build: .
    image: helpdesk-app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/helpdesk
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # API do help desk (OpenAPI em http://localhost:8000/docs), com 4 processos e sem laços.
  nucleo:
    image: helpdesk-app
    restart: on-failure
    command: ["uvicorn", "nucleo.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--workers", "4"]
    ports:
      - "${NUCLEO_PORTA:-8000}:8000"
    environment: &ambiente_nucleo
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/helpdesk
      BROKER_URL: http://broker:8100
      CANAIS_URL: http://canais:8300
      OUTBOX_ATIVA: ${OUTBOX_ATIVA:-true}
      INBOX_ATIVA: ${INBOX_ATIVA:-true}
      FENCING_ATIVO: ${FENCING_ATIVO:-true}
      TIMEOUT_ATIVO: ${TIMEOUT_ATIVO:-true}
      TIMEOUT_AGENTE_S: ${TIMEOUT_AGENTE_S:-30}
      WORKERS_ATIVOS: "false"
      # Pool do tamanho da concorrência: abaixo disso as conexões extras abriam e fechavam a cada
      # uso (autenticação SCRAM a cada vez), queimando CPU no Postgres e no Python (24/11).
      DB_POOL: ${DB_POOL:-20}
    depends_on:
      migracoes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Laços de fundo do núcleo: relay da outbox, agendador e distribuidor. Quatro processos: nos
  # testes de carga, cada processo chega a 100% de um núcleo de CPU (Python, um laço por processo);
  # com dois, o relay saía ~50 itens/s e a outbox acumulava a 25 msg/s do cliente (24/11).
  # Seguro em paralelo: todo trabalho é reservado com FOR UPDATE SKIP LOCKED.
  trabalhador:
    image: helpdesk-app
    restart: on-failure
    deploy:
      replicas: ${TRABALHADOR_REPLICAS:-4}
    command: ["python", "-m", "nucleo.trabalhador"]
    environment:
      <<: *ambiente_nucleo
      WORKERS_ATIVOS: "true"
      # Por processo; com 4 processos, 16 no relay e 8 no distribuidor. Mais que isso só aumentava
      # a disputa e as consultas em vão quando não há trabalho (24/11).
      RELAY_WORKERS: ${RELAY_WORKERS:-4}
      DISTRIBUIDOR_TAREFAS: ${DISTRIBUIDOR_TAREFAS:-2}
    depends_on:
      migracoes:
        condition: service_completed_successfully

  broker:
    image: helpdesk-app
    restart: on-failure
    command: ["uvicorn", "broker.main:app", "--host", "0.0.0.0", "--port", "8100", "--no-access-log"]
    ports:
      - "${BROKER_PORTA:-8100}:8100"
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      NUCLEO_URL: http://nucleo:8000
    depends_on:
      topicos:
        condition: service_completed_successfully
      migracoes:
        condition: service_completed_successfully

  agente_mock:
    image: helpdesk-app
    restart: on-failure
    command: ["uvicorn", "agente_mock.main:app", "--host", "0.0.0.0", "--port", "8200", "--no-access-log"]
    ports:
      - "${MOCK_PORTA:-8200}:8200"
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      MOCK_DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/agente_mock
      LATENCIA_MS: ${LATENCIA_MS:-800}
      TIMEOUT_AGENTE_S: ${TIMEOUT_AGENTE_S:-30}
    depends_on:
      topicos:
        condition: service_completed_successfully
      migracoes:
        condition: service_completed_successfully

  canais:
    image: helpdesk-app
    restart: on-failure
    command: ["uvicorn", "canais.main:app", "--host", "0.0.0.0", "--port", "8300", "--no-access-log"]
    ports:
      - "${CANAIS_PORTA:-8310}:8300"
    environment:
      CANAIS_DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/canais
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  redpanda:
